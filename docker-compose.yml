# Development stack. Credentials below are for local development only.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hprrims
      MYSQL_USER: hprrims
      MYSQL_PASSWORD: ${DB_PASSWORD:-hprrims_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      retries: 20

  ml-service:
    build: ./ml-service
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-}
    ports: ["8001:8001"]

  backend:
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
      ml-service: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/hprrims?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: hprrims
      DB_PASSWORD: ${DB_PASSWORD:-hprrims_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  mysql-data:
